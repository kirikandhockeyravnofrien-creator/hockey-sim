<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pro Hockey Sim</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Pro Hockey Sim">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <div id="app">

    <!-- ГЛАВНОЕ МЕНЮ -->
    <section id="screen-menu" class="screen">
      <h1>PRO HOCKEY SIM</h1>
      <button class="menu-btn" data-go="teams">КОМАНДЫ</button>
      <button class="menu-btn" data-go="quick">БЫСТРЫЙ МАТЧ</button>
      <button class="menu-btn" data-go="tournaments">ТУРНИРЫ</button>
      <div class="account">
        <span id="acc-email"></span>
        <span id="sync-status"></span>
        <button id="btn-logout">Выйти</button>
        <span id="app-ver"></span>
        <button id="btn-refresh">Обновить игру</button>
      </div>
    </section>

    <!-- ВХОД -->
    <section id="screen-auth" class="screen active">
      <h1>PRO HOCKEY SIM</h1>
      <p id="auth-loading" class="placeholder">Загрузка…</p>
      <div id="auth-form" style="display:none">
        <label>Email</label>
        <input id="au-email" type="email" autocomplete="username" autocapitalize="none" placeholder="name@mail.com">
        <label>Пароль (минимум 6 символов)</label>
        <input id="au-pass" type="password" autocomplete="current-password">
        <p id="au-msg" class="auth-msg"></p>
        <button class="menu-btn full primary" id="btn-login">ВОЙТИ</button>
        <button class="menu-btn full" id="btn-register">РЕГИСТРАЦИЯ</button>
        <button class="linkbtn" id="btn-reset">Забыли пароль?</button>
      </div>
    </section>

    <!-- КОМАНДЫ: список -->
    <section id="screen-teams" class="screen">
      <header><button class="back" data-go="menu">‹</button><h2>КОМАНДЫ</h2></header>
      <div class="seg" id="teams-tabs">
        <button data-v="club" class="active">КЛУБЫ</button>
        <button data-v="national">СБОРНЫЕ</button>
      </div>
      <div id="team-list" style="margin-top:14px"></div>
      <button class="menu-btn add-btn primary" id="btn-new-team">+ НОВЫЙ КЛУБ</button>
    </section>

    <!-- КОМАНДЫ: создание -->
    <section id="screen-team-edit" class="screen">
      <header><button class="back" data-go="teams">‹</button><h2 id="team-title">НОВЫЙ КЛУБ</h2></header>
      <div id="emblem-preview" class="emblem-preview"></div>
      <label>Название</label>
      <input id="team-name" type="text" maxlength="24" placeholder="Например, Ак Барс">
      <label>Рейтинг: <b id="rating-value">75</b></label>
      <input id="team-rating" type="range" min="50" max="99" value="75">
      <div id="country-box">
        <label>Страна (флаг)</label>
        <select id="team-country"></select>
      </div>
      <label>Эмблема</label>
      <div class="upload-row">
        <label class="upload-btn" for="team-img">📷 Загрузить из галереи</label>
        <input id="team-img" class="vh" type="file" accept="image/*">
        <button class="mini" id="team-img-clear" style="display:none">Убрать фото</button>
      </div>
      <div id="icon-grid" class="grid"></div>
      <label>Цвет</label>
      <div id="color-grid" class="grid"></div>
      <button class="menu-btn primary" id="btn-save-team">СОХРАНИТЬ</button>
    </section>

    <!-- БЫСТРЫЙ МАТЧ -->
    <section id="screen-quick" class="screen">
      <header><button class="back" data-go="menu">‹</button><h2>БЫСТРЫЙ МАТЧ</h2></header>
      <p id="qm-warn" class="placeholder" style="display:none"></p>
      <div class="qm-teams">
        <div class="qm-card" id="qm-home"></div>
        <div class="qm-vs">VS</div>
        <div class="qm-card" id="qm-away"></div>
      </div>
      <button class="menu-btn full" id="btn-quick-instant">БЫСТРЫЙ МАТЧ</button>
      <button class="menu-btn full primary" id="btn-quick-sim">СИМУЛЯЦИЯ</button>
    </section>

    <!-- МАТЧ -->
    <section id="screen-match" class="screen">
      <header><button class="back" id="match-back">‹</button><h2>МАТЧ</h2></header>
      <div class="scoreboard">
        <div class="sb-team" id="sb-home"></div>
        <div class="sb-mid">
          <div class="sb-score"><span id="sb-hg">0</span> : <span id="sb-ag">0</span></div>
          <div class="sb-period" id="sb-period">1st</div>
          <div class="sb-clock" id="sb-clock">20:00</div>
        </div>
        <div class="sb-team" id="sb-away"></div>
      </div>
      <div class="speed" id="speed-box">
        <button data-speed="10">Медленно</button>
        <button data-speed="40" class="active">Средне</button>
        <button data-speed="120">Быстро</button>
        <button id="btn-skip">Пропустить</button>
      </div>
      <div id="match-stats"></div>
      <div id="match-log" class="log"></div>
    </section>

    <!-- ТУРНИРЫ: список -->
    <section id="screen-tournaments" class="screen">
      <header><button class="back" data-go="menu">‹</button><h2>ТУРНИРЫ</h2></header>
      <div id="tour-list"></div>
      <button class="menu-btn add-btn primary" id="btn-new-tour">+ НОВЫЙ ТУРНИР</button>
      <button class="menu-btn add-btn" id="btn-new-playoff">+ ПЛЕЙ-ОФФ</button>
    </section>

    <!-- ТУРНИРЫ: создание -->
    <section id="screen-tournament-edit" class="screen">
      <header><button class="back" data-go="tournaments">‹</button><h2 id="te-title">НОВЫЙ ТУРНИР</h2></header>
      <div class="seg" id="te-kind">
        <button data-v="tournament" class="active">ТУРНИР</button>
        <button data-v="playoff">ПЛЕЙ-ОФФ</button>
      </div>
      <div id="te-emblem" class="emblem-preview"></div>
      <label>Название</label>
      <input id="te-name" type="text" maxlength="28" placeholder="Например, Кубок Гагарина">
      <label>Эмблема</label>
      <div class="upload-row">
        <label class="upload-btn" for="te-img">📷 Загрузить из галереи</label>
        <input id="te-img" class="vh" type="file" accept="image/*">
        <button class="mini" id="te-img-clear" style="display:none">Убрать фото</button>
      </div>
      <div id="te-icons" class="grid"></div>
      <label>Цвет</label>
      <div id="te-colors" class="grid"></div>

      <div id="sec-preset">
        <label>Предустановка</label>
        <div class="seg" id="te-preset">
          <button data-v="custom" class="active">СВОЙ ТУРНИР</button>
          <button data-v="khl">КХЛ</button>
        </div>
        <p class="note" id="preset-note"></p>
      </div>

      <div id="sec-tours">
        <label>Количество туров</label>
        <input id="te-tours" type="number" inputmode="numeric" min="1" max="400" value="10">
        <label>Очков за победу</label>
        <div class="seg" id="te-pts">
          <button data-v="2">2 очка</button>
          <button data-v="3" class="active">3 очка</button>
        </div>
      </div>

      <label id="lbl-format">Формат таблицы</label>
      <div class="seg" id="te-format">
        <button data-v="league" class="active">ВСЯ ЛИГА</button>
        <button data-v="conf">КОНФЕРЕНЦИИ</button>
      </div>
      <div id="conf-box" style="display:none">
        <label>Названия конференций</label>
        <div class="conf-names">
          <input id="te-conf0" type="text" maxlength="14" value="Запад">
          <input id="te-conf1" type="text" maxlength="14" value="Восток">
        </div>
        <p class="note" id="conf-count"></p>
      </div>

      <div id="sec-po">
        <div id="po-toggle-box">
          <label>Плей-офф после сезона</label>
          <div class="seg" id="te-po">
            <button data-v="off" class="active">НЕТ</button>
            <button data-v="on">ЕСТЬ</button>
          </div>
        </div>
        <div id="po-opts" style="display:none">
          <div id="po-n-box">
            <label id="lbl-po-n">Сколько команд выходит в плей-офф</label>
            <input id="te-po-n" type="number" inputmode="numeric" min="2" max="64" value="8">
          </div>
          <label>Серия</label>
          <div class="seg" id="te-bo">
            <button data-v="1">1 матч</button>
            <button data-v="3">до 2 побед</button>
            <button data-v="5">до 3 побед</button>
            <button data-v="7" class="active">до 4 побед</button>
          </div>
        </div>
      </div>

      <label>Команды <button class="mini" id="te-all">Выбрать всех</button></label>
      <div class="seg" id="te-tabs">
        <button data-v="club" class="active">КЛУБЫ</button>
        <button data-v="national">СБОРНЫЕ</button>
      </div>
      <div id="te-teams" style="margin-top:12px"></div>
      <button class="menu-btn full primary" id="btn-create-tour">СОЗДАТЬ ТУРНИР</button>
      <div style="height:24px"></div>
    </section>

    <!-- ТУРНИР: просмотр -->
    <section id="screen-tournament" class="screen">
      <header><button class="back" data-go="tournaments">‹</button><h2 id="tv-title">ТУРНИР</h2></header>
      <div id="tv-banner" class="banner"></div>
      <div class="seg" id="tv-tabs">
        <button id="tvtab-table" data-v="table" class="active">ТАБЛИЦА</button>
        <button id="tvtab-matches" data-v="matches">МАТЧИ</button>
        <button id="tvtab-playoff" data-v="playoff">ПЛЕЙ-ОФФ</button>
      </div>
      <div id="tv-table"></div>
      <div id="tv-matches" style="display:none">
        <div class="tour-nav">
          <button id="tour-prev">‹</button><b id="tour-label"></b><button id="tour-next">›</button>
        </div>
        <div id="tour-games"></div>
      </div>
      <div id="tv-playoff" style="display:none"><div id="po-view"></div></div>
      <div class="actions" id="actions-season">
        <button class="menu-btn" id="btn-play-tour">СЫГРАТЬ ТУР</button>
        <button class="menu-btn" id="btn-play-all">СЫГРАТЬ ВСЁ</button>
      </div>
      <div class="actions" id="actions-po" style="display:none">
        <button class="menu-btn" id="btn-po-round">СЫГРАТЬ РАУНД</button>
        <button class="menu-btn" id="btn-po-all">СЫГРАТЬ ВСЁ</button>
      </div>
    </section>

    <!-- Окно выбора команды -->
    <div id="picker" class="overlay">
      <header><button class="back" id="picker-close">✕</button><h2>ВЫБОР КОМАНДЫ</h2></header>
      <div class="seg" id="picker-tabs">
        <button data-v="club" class="active">КЛУБЫ</button>
        <button data-v="national">СБОРНЫЕ</button>
      </div>
      <div id="picker-list" style="margin-top:14px"></div>
    </div>

  </div>
  <script src="engine.js?v=4"></script>
  <script src="app.js?v=4"></script>
  <script type="module" src="cloud.js"></script>
</body>
</html>
